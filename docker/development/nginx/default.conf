server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    # Handle localized URLs
    location ~ ^/(en|sl)/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Handle static files, but exclude Livewire and Flux assets
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Let Laravel handle Livewire and Flux JavaScript files
    location ~* ^/(livewire|flux)/.*\.js$ {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Handle other JS files as static
    location ~* \.(js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}